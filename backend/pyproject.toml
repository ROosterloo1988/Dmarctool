[project]
name = "dmarc"
version = "0.1.0"
description = "DMARC aggregate (RUA) and forensic (RUF) report processing"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "defusedxml>=0.7",
    "publicsuffixlist>=1.0",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "msal>=1.28",
    "dnspython>=2.6",
    "maxminddb>=2.5",
    "pyyaml>=6",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mmdb-writer>=0.2"]

[project.scripts]
dmarc = "dmarc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dmarc*"]

[tool.setuptools.package-data]
dmarc = ["senders.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
