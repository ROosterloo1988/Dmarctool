# Phase 1: database + CLI container (import / parse / migrate).
# Later phases add the 'api', 'worker' and 'backup' services.
name: dmarc

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dmarc
      POSTGRES_USER: dmarc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmarc -d dmarc"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Only exposed on localhost, for running the tests from the host.
    ports:
      - "127.0.0.1:5432:5432"

  cli:
    build: ./backend
    profiles: ["tools"]
    env_file: .env
    environment:
      DMARC_DATABASE_URL: postgresql+psycopg://dmarc:${POSTGRES_PASSWORD}@db:5432/dmarc
      DMARC_TEST_DATABASE_URL: postgresql+psycopg://dmarc:${POSTGRES_PASSWORD}@db:5432/dmarc_test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./import:/import:ro

volumes:
  pgdata:
