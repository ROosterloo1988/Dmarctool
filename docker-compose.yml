# DMARC reporting: database, web UI/API, worker (mail fetch, enrichment, DNS checks, retention)
# and daily backups.
name: dmarc

x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: dmarc-app:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DMARC_DATABASE_URL: postgresql+psycopg://dmarc:${POSTGRES_PASSWORD}@db:5432/dmarc
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - ./secrets:/run/secrets/dmarc:ro   # e.g. graph-cert.pem (DMARC_GRAPH_CERTIFICATE_PATH)
    - geoip:/data/geoip                 # DB-IP Lite databases, refreshed monthly by the worker

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dmarc
      POSTGRES_USER: dmarc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmarc -d dmarc"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Only on localhost (for running tests from the host). Remove in production if unused.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"

  migrate:
    <<: *app
    restart: "no"
    command: ["migrate"]

  api:
    <<: *app
    command: ["api", "--port", "8080"]
    environment:
      DMARC_DATABASE_URL: postgresql+psycopg://dmarc:${POSTGRES_PASSWORD}@db:5432/dmarc
      # Only trust X-Forwarded-* from the Application Gateway subnet (set in .env).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      # The Azure Application Gateway connects to <docker-host-private-ip>:8080.
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

  # One-off commands: docker compose run --rm cli <command>
  cli:
    <<: *app
    restart: "no"
    profiles: ["tools"]
    environment:
      DMARC_DATABASE_URL: postgresql+psycopg://dmarc:${POSTGRES_PASSWORD}@db:5432/dmarc
      DMARC_TEST_DATABASE_URL: postgresql+psycopg://dmarc:${POSTGRES_PASSWORD}@db:5432/dmarc_test
    volumes:
      - ./import:/import:ro
      - ./secrets:/run/secrets/dmarc:ro
      - geoip:/data/geoip

volumes:
  pgdata:
  geoip:
